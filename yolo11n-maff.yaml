# Ultralytics YOLO11n + MAFF for dense small-object detection.
# MAFF is inserted only before Detect; Backbone and the original Neck body remain unchanged.

nc: 80 # number of classes; overridden by the dataset configuration during training
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12-cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15-cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16-P3/8 Neck output

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 18-cat head P4
  - [-1, 2, C3k2, [512, False]] # 19-P4/16 Neck output

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 21-cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22-P5/32 Neck output

  - [[16, 19, 22], 1, MAFF, [256, "p3"]] # 23-P3_MAFF: align P3/P4/P5 to P3/8
  - [[16, 19, 22], 1, MAFF, [512, "p4"]] # 24-P4_MAFF: align P3/P4/P5 to P4/16
  - [[16, 19, 22], 1, MAFF, [1024, "p5"]] # 25-P5_MAFF: align P3/P4/P5 to P5/32

  - [[23, 24, 25], 1, Detect, [nc]] # 26-Detect(P3_MAFF, P4_MAFF, P5_MAFF)
